# TrueSignal public demo: static frontend + /api/* -> 127.0.0.1:3000.
# Installed as /etc/nginx/conf.d/truesignal.conf by deploy/remote/install.sh.

# Per-IP limits. Polling is 2/s while busy; Bedrock-backed routes cost money.
limit_req_zone $binary_remote_addr zone=ts_api:10m   rate=10r/s;
limit_req_zone $binary_remote_addr zone=ts_ai:10m    rate=30r/m;
limit_req_zone $binary_remote_addr zone=ts_reset:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80 default_server;
    listen [::]:80 default_server;  # stock nginx.conf's server is not default

    root /usr/share/nginx/truesignal;
    index index.html;
    client_max_body_size 16k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The frontend shows `error` from JSON bodies; nginx's default 429 is HTML.
    error_page 429 = @ratelimited;
    location @ratelimited {
        default_type application/json;
        return 429 '{"error": "Too many requests. Wait a few seconds and try again."}';
    }

    location / {
        try_files $uri /index.html;
    }
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Routes that call Bedrock. Fast-forward replays (X-Replay) also land here,
    # hence the burst: "Start here" sends ~10 requests in a few seconds.
    location ~ ^/api/(sms/inbound|rumors/[^/]+/verify|outbound/[^/]+/(edit|approve)|chaos/[^/]+)$ {
        limit_req zone=ts_ai burst=20 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 180s;  # a rumor wave takes ~30 s on Bedrock
    }
    location = /api/reset {
        limit_req zone=ts_reset burst=5 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3000;
    }
    location /api/ {
        limit_req zone=ts_api burst=40 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 60s;
    }
}
